name: CI

on:
  push:
    branches-ignore: main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: notework
    steps:
      - uses: actions/checkout@v4
        with: { path: notework }
      # Notework links the sibling engine checkout (`link:../visual.editor`).
      - uses: actions/checkout@v4
        with: { repository: legitminh/visual.editor, path: visual.editor }
      - uses: pnpm/action-setup@v3
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm, cache-dependency-path: notework/pnpm-lock.yaml }
      - run: pnpm install
      - run: pnpm check
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test tests/visual.spec.ts tests/raster.spec.ts tests/drawing-input.spec.ts tests/features.spec.ts tests/menus.spec.ts tests/github.spec.ts tests/export.spec.ts --reporter=line
        env: { CI: '1' }
      - name: Show failure snapshots
        if: failure()
        run: find test-results -name error-context.md -exec sh -c 'echo "===== $1"; head -c 6000 "$1"' _ {} \;
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-results, path: notework/test-results, retention-days: 7 }

  # Reproduces local development exactly: fresh install with the sibling engine, `pnpm dev`, real page loads.
  dev-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: notework
    steps:
      - uses: actions/checkout@v4
        with: { path: notework }
      - uses: actions/checkout@v4
        with: { repository: legitminh/visual.editor, path: visual.editor }
      - uses: pnpm/action-setup@v3
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: pnpm install --reporter=append-only
      - name: Keyflow package was built
        run: |
          ls -la node_modules/@legitminh/keyflow node_modules/@legitminh/keyflow/dist | head -20
          test -f node_modules/@legitminh/keyflow/dist/styles.css
          test -f node_modules/@legitminh/keyflow/dist/components/NumberBox.svelte
          test -f node_modules/visual.editor/src/index.ts
      - name: Dev server serves the app without errors
        run: |
          (pnpm dev --host 127.0.0.1 --port 5173 > dev.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:5173/ -o page.html && break; sleep 1; done
          curl -s -o page.html -w "%{http_code}\n" http://127.0.0.1:5173/ | tee status.txt
          grep -q 200 status.txt
          ! grep -qi "internal server error\|cannot find module" page.html dev.log
          tail -20 dev.log
      - run: pnpm exec playwright install --with-deps chromium
      - name: Visual editor works on the dev server
        # Reuse the dev server started above (Playwright only reuses servers outside CI mode).
        env: { CI: '' }
        run: pnpm exec playwright test tests/visual.spec.ts tests/raster.spec.ts --reporter=line
