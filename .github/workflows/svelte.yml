name: Deploy to GitHub Pages

on:
  push:
    branches: 'main'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build_site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: notework

      # Notework links the sibling engine checkout (`link:../visual.editor`).
      - name: Checkout visual.editor
        uses: actions/checkout@v4
        with:
          repository: legitminh/visual.editor
          path: visual.editor

      # If you're using pnpm, add this step then change the commands and cache key below to use `pnpm`
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: notework/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: notework
        run: pnpm install

      - name: build
        working-directory: notework
        env:
          BASE_PATH: ''
        run: |
          pnpm build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          # this should match the `pages` option in your adapter-static options
          path: './notework/build'

  deploy:
    needs: build_site
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
