[package]
name = "notework"
version = "0.1.0"
description = "Notework native app"
authors = ["legitminh"]
edition = "2021"

[lib]
# The _lib suffix avoids a name clash with the binary on Windows.
name = "notework_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"
# GitHub device-flow login requests (rustls, no system OpenSSL).
ureq = { version = "2.12", default-features = false, features = ["tls"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# Linux only: turn on WebKitGTK's storage features (OPFS) before the page loads.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"
