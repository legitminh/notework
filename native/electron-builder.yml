appId: io.github.legitminh.notework
productName: Notework
copyright: Copyright © legitminh
directories:
  output: dist
  buildResources: resources
# Only the shell's main process goes into app.asar; the web build ships beside it.
files:
  - electron/**
  - package.json
extraResources:
  - from: ../build
    to: web
asar: true
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]
  # Ad hoc signed so Apple silicon runs it. For distribution, override with a Developer ID
  # identity (-c.mac.identity=...) and notarize.
  identity: '-'
  hardenedRuntime: true
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
win:
  target:
    - target: nsis
      arch: [x64, arm64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  executableName: notework
  category: Office
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  maintainer: legitminh <90986973+legitminh@users.noreply.github.com>
  synopsis: A local network of text documents and folders.
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
publish: null
